<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>性格診断アプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>内向的・外向的 診断</h1>
        </header>

        <main id="app-content">
            <!-- スタート画面 -->
            <div id="start-view" class="view">
                <p>あなたの性格を診断します。5つの質問に答えてください。</p>
                <button id="start-btn" class="primary-btn">診断を始める</button>
            </div>

            <!-- クイズ画面 -->
            <div id="quiz-view" class="view hidden">
                <div class="progress-container">
                    <div id="progress-bar"></div>
                </div>
                <p id="question-text"></p>
                <div class="options">
                    <button class="option-btn" data-value="1">はい</button>
                    <button class="option-btn" data-value="0">いいえ</button>
                </div>
            </div>

            <!-- 結果画面 -->
            <div id="result-view" class="view hidden">
                <h2>診断結果</h2>
                <p id="result-type" class="result-highlight"></p>
                <p id="result-desc"></p>
                <button id="restart-btn" class="secondary-btn">もう一度診断する</button>
            </div>
        </main>

        <section id="history-section">
            <h3>診断履歴</h3>
            <ul id="history-list"></ul>
            <button id="clear-history-btn" class="text-btn">履歴をクリア</button>
        </section>
    </div>
    <script src="app.js"></script>
</body>
</html>
