<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>性格診断アプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>チーム適正スキャン</h1>
        </header>

        <main id="app-content">
            <!-- スタート画面 -->
            <div id="start-view" class="view">
                <button id="start-btn" class="primary-btn">診断を始める</button>
            </div>

            <!-- クイズ画面 -->
            <div id="quiz-view" class="view hidden">
                <div class="progress-info">
                    <span id="question-count"></span>
                </div>
                <div class="progress-container">
                    <div id="progress-bar"></div>
                </div>
                <div class="question-container">
                    <p id="question-text"></p>
                </div>
                <div class="options">
                </div>
            </div>

            <!-- 結果画面 -->
            <div id="result-view" class="view hidden">
                <div id="result-illustration" class="type-illustration"></div>
                <div id="result-type"></div>
                <div id="result-desc"></div>
                <div class="result-footer">
                    <button id="restart-btn" class="secondary-btn">もう一度診断する</button>
                </div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
